<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Required</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 30px;
    }

    h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: 600;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    #pwd {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    #pwd:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    #pwd::placeholder {
      color: #aaa;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 16px;
      padding: 5px;
      transition: color 0.3s ease;
    }

    .toggle-password:hover {
      color: #667eea;
    }

    #loginBtn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }

    #loginBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    #loginBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #loginBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }

    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }

    .attempts-remaining {
      font-size: 12px;
      color: #666;
      margin-top: -10px;
      margin-bottom: 15px;
    }

    .loading {
      display: none;
      margin-top: 10px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">🔒</div>
    <h2>Authentication Required</h2>
    <p class="subtitle">Enter your password to continue</p>

    <div id="message" class="message"></div>

    <div id="attemptsInfo" class="attempts-remaining"></div>

    <div class="input-group">
      <input 
        type="password" 
        id="pwd" 
        placeholder="Enter password"
        autocomplete="off"
      />
      <button class="toggle-password" id="togglePwd" title="Show/Hide password">
        👁️
      </button>
    </div>

    <button id="loginBtn">Login</button>

    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>

    <div class="footer">
      Filter Housing Selection Application
    </div>
  </div>

  <script>
    const { ipcRenderer } = require("electron");

    const pwdInput = document.getElementById("pwd");
    const loginBtn = document.getElementById("loginBtn");
    const togglePwdBtn = document.getElementById("togglePwd");
    const messageDiv = document.getElementById("message");
    const attemptsInfo = document.getElementById("attemptsInfo");
    const loadingDiv = document.getElementById("loading");

    // Toggle password visibility
    togglePwdBtn.addEventListener("click", () => {
      if (pwdInput.type === "password") {
        pwdInput.type = "text";
        togglePwdBtn.textContent = "🙈";
      } else {
        pwdInput.type = "password";
        togglePwdBtn.textContent = "👁️";
      }
    });

    // Show message
    function showMessage(text, type = "error") {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type} show`;
      
      if (type === "success") {
        setTimeout(() => {
          messageDiv.classList.remove("show");
        }, 2000);
      }
    }

    // Update attempts remaining
    function updateAttemptsInfo(remaining) {
      if (remaining > 0) {
        attemptsInfo.textContent = `${remaining} attempt(s) remaining`;
        attemptsInfo.style.display = "block";
      } else {
        attemptsInfo.style.display = "none";
      }
    }

    // Submit password
    function submitPassword() {
      const pwd = pwdInput.value.trim();

      if (!pwd) {
        showMessage("Please enter a password");
        pwdInput.focus();
        return;
      }

      // Disable input and button
      pwdInput.disabled = true;
      loginBtn.disabled = true;
      loadingDiv.classList.add("show");
      messageDiv.classList.remove("show");

      // Send password to main process
      ipcRenderer.send("check-password", pwd);
    }

    // Handle password result
    ipcRenderer.on("password-result", (event, result) => {
      // Re-enable input and button
      pwdInput.disabled = false;
      loginBtn.disabled = false;
      loadingDiv.classList.remove("show");

      if (result.success) {
        showMessage(result.message, "success");
        // Window will be closed by main process
      } else {
        showMessage(result.message, "error");
        updateAttemptsInfo(result.attemptsRemaining);
        pwdInput.value = "";
        pwdInput.focus();
      }
    });

    // Enter key to submit
    pwdInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        submitPassword();
      }
    });

    // Login button click
    loginBtn.addEventListener("click", submitPassword);

    // Focus password input on load
    window.addEventListener("load", () => {
      pwdInput.focus();
    });

    // Prevent context menu (right-click)
    document.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
